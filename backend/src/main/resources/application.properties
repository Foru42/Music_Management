
spring.application.name=backend

# Cargar configuracion local desde .env (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spr_musika?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Logs
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# Puerto
server.port=${SERVER_PORT:8080}

# JWT: debe ser una clave secreta propia y segura
jwt.secret=${JWT_SECRET}

# Endpoints
api.usuarios=/api/usuarios
api.login=/api/auth
api.preguntas=/api/preguntas
api.preguntasRespuestas=/api/preguntasRespuestas
api.canciones=/api/canciones
api.estilos=/api/estilos
api.cancion.mp3=/api/download/mp3

# Herramientas multimedia
ytdlp.path=${YTDLP_PATH:}
ffmpeg.location=${FFMPEG_LOCATION:}
