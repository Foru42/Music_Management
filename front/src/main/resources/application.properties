
spring.application.name=front

# El front no necesita conexión directa a la base de datos
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Evitar logs detallados de peticiones y cabeceras
logging.level.org.springframework.web.client.RestClient=INFO
logging.level.org.springframework.http.client=INFO

# Puerto del front
server.port=${SERVER_PORT:9090}

# Ruta de imágenes
ruta.imagenes=${RUTA_IMAGENES:src/main/resources/static/imagenes}

# URL de la API
url.api.usuario=${API_URL_USUARIO}
url.api.login=${API_URL_LOGIN}
url.api.preguntas=${API_URL_PREGUNTAS}
url.api.preguntasRespuesta=${API_URL_PREGUNTAS_RESPUESTAS}
url.api.canciones=${API_URL_CANCIONES}
url.api.estilos=${API_URL_ESTILOS}
url.api.mp3=${API_URL_MP3}
